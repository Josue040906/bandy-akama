spring.application.name=bandy-akama
spring.config.import=optional:file:.env[.properties]
server.port=8090
spring.datasource.url=${BANDY_DB_URL:jdbc:postgresql://localhost:5433/bandy_akama}
spring.datasource.username=${BANDY_DB_USERNAME:postgres}
spring.datasource.password=${BANDY_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
bandy.ai.model=${GEMINI_MODEL:gemini-3.8-flash}
bandy.tools.connect-timeout-seconds=${BANDY_TOOL_CONNECT_TIMEOUT_SECONDS:5}
bandy.tools.read-timeout-seconds=${BANDY_TOOL_READ_TIMEOUT_SECONDS:30}
bandy.tools.registration-key=${BANDY_REGISTRATION_KEY:}
bandy.user-token.secret=${JWT_SECRET:}
bandy.conversations.application-id=${BANDY_APPLICATION_ID:assistant-rh}
bandy.conversations.allowed-application-ids=${BANDY_ALLOWED_APPLICATION_IDS:}
bandy.conversations.context.recent-messages=${BANDY_CONTEXT_RECENT_MESSAGES:8}
bandy.conversations.context.max-summary-characters=${BANDY_CONTEXT_MAX_SUMMARY_CHARACTERS:4000}
bandy.conversations.context.max-characters=${BANDY_CONTEXT_MAX_CHARACTERS:18000}
bandy.cors.allowed-origins=${BANDY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
