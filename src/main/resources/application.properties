spring.application.name=bandy-akama
spring.config.import=optional:file:.env[.properties]
server.port=8090
spring.datasource.url=${BANDY_DB_URL:jdbc:postgresql://localhost:5433/bandy_akama}
spring.datasource.username=${BANDY_DB_USERNAME:postgres}
spring.datasource.password=${BANDY_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
bandy.ai.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
bandy.ai.service-tier=${BANDY_GEMINI_SERVICE_TIER:standard}
bandy.ai.thinking-level=${BANDY_GEMINI_THINKING_LEVEL:low}
bandy.ai.max-output-tokens=${BANDY_GEMINI_MAX_OUTPUT_TOKENS:1024}
bandy.ai.timeout-millis=${BANDY_GEMINI_TIMEOUT_MILLIS:15000}
bandy.ai.retry-attempts=${BANDY_GEMINI_RETRY_ATTEMPTS:2}
bandy.ai.max-tool-rounds=${BANDY_MAX_TOOL_ROUNDS:2}
bandy.ai.turn-budget-millis=${BANDY_TURN_BUDGET_MILLIS:30000}
bandy.tools.connect-timeout-seconds=${BANDY_TOOL_CONNECT_TIMEOUT_SECONDS:5}
bandy.tools.read-timeout-seconds=${BANDY_TOOL_READ_TIMEOUT_SECONDS:15}
bandy.tools.registration-key=${BANDY_REGISTRATION_KEY:}
bandy.user-token.secret=${JWT_SECRET:}
bandy.conversations.application-id=${BANDY_APPLICATION_ID:assistant-rh}
bandy.conversations.allowed-application-ids=${BANDY_ALLOWED_APPLICATION_IDS:}
bandy.conversations.context.recent-messages=${BANDY_CONTEXT_RECENT_MESSAGES:10}
bandy.conversations.context.max-summary-characters=${BANDY_CONTEXT_MAX_SUMMARY_CHARACTERS:4000}
bandy.conversations.context.max-characters=${BANDY_CONTEXT_MAX_CHARACTERS:18000}
bandy.cors.allowed-origins=${BANDY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
