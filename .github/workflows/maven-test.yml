name: Maven tests

on:
  push:
    branches:
      - refactor/context-driven-intent-resolution
      - feature/recherche-unifiee-agents
  pull_request:
    branches:
      - feature/recherche-unifiee-agents

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test
