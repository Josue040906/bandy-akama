name: Maven CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Maven tests (Java 17 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bandy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bandy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven test suite
        run: ./mvnw -B clean test
        env:
          BANDY_POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/bandy_test
          BANDY_POSTGRES_TEST_USERNAME: postgres
          BANDY_POSTGRES_TEST_PASSWORD: postgres
